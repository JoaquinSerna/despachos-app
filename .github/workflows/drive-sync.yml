name: Sincronizar Huemul (OC e ingresos) desde Drive

# Llama a la app todos los días para que importe los exports que Huemul deja en la carpeta de Drive
# (compras_AAAAMMDD_HHMM.xlsx y compras_ingreso_AAAAMMDD_HHMM.xlsx). Reintenta hasta que estén los dos
# archivos del día y, si no llegan, el trabajo falla y GitHub avisa por mail.
#
# Configuración (una sola vez): en Settings → Secrets and variables → Actions → New repository secret
#   SYNC_SECRET = el mismo valor que STOCK_IMPORT_SECRET (o COMPRAS_SYNC_SECRET) en Vercel
# Opcional: la variable APP_URL si la dirección de la app cambia.

on:
  schedule:
    # 6:30am Argentina (UTC-3) = 9:30 UTC
    - cron: '30 9 * * *'
  # También se puede correr a mano desde la pestaña Actions
  workflow_dispatch:

jobs:
  sync:
    name: Importar OC e ingresos de Huemul
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Llamar a la sincronización (reintenta hasta que estén los archivos del día)
        env:
          APP_URL: ${{ vars.APP_URL || 'https://despachos-app-omega.vercel.app' }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          if [ -z "${SYNC_SECRET:-}" ]; then
            echo "Falta el secreto SYNC_SECRET del repositorio (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          HOY=$(TZ=America/Argentina/Buenos_Aires date +%Y%m%d)
          for intento in 1 2 3 4 5; do
            echo "Intento $intento de 5 — $(TZ=America/Argentina/Buenos_Aires date '+%d/%m %H:%M')"
            RESP=$(curl -sS --max-time 150 -X POST "$APP_URL/api/drive-sync" -H "x-cron-secret: $SYNC_SECRET" || true)
            echo "$RESP" | jq . 2>/dev/null || echo "$RESP"
            # Listo cuando los dos archivos de hoy están importados (recién o de una corrida anterior)
            LISTOS=$(echo "$RESP" | jq --arg hoy "$HOY" '[.resultados[]? | select((.archivo // "") | contains($hoy)) | select(.ok == true or .motivo == "Ya estaba importado")] | length' 2>/dev/null || echo 0)
            if [ "${LISTOS:-0}" -ge 2 ]; then
              echo "OK: órdenes de compra e ingresos al día."
              exit 0
            fi
            if [ "$intento" -lt 5 ]; then
              echo "Todavía no están los dos archivos de hoy. Reintento en 10 minutos."
              sleep 600
            fi
          done
          echo "No se pudieron importar los dos archivos de hoy ($HOY). Revisá Compras → Ingresos → Sincronización."
          exit 1
